<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Langton's Ant Multi-Rule Simulation</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0f172a; }
  canvas { image-rendering: pixelated; }
  .control-section { border-bottom: 1px solid #334155; }
</style>
</head>
<body class="text-slate-200 min-h-screen p-4">
<div class="max-w-6xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-4 text-cyan-400">Langton's Ant Multi-Rule Simulation</h1>

  <div class="flex flex-col lg:flex-row gap-4">
    <!-- Canvas -->
    <div class="flex-1 flex flex-col items-center">
      <canvas id="antCanvas" width="500" height="500" class="border border-slate-600 rounded-lg" style="max-width:100%"></canvas>
      <div class="mt-2 text-slate-400 text-sm">Generation: <span id="genCounter" class="text-cyan-300 font-mono font-bold">0</span></div>
    </div>

    <!-- Controls -->
    <div class="lg:w-80 bg-slate-800 rounded-xl p-4 space-y-4 overflow-y-auto" style="max-height:520px">

      <!-- Presets -->
      <div class="control-section pb-3">
        <h2 class="text-sm font-semibold text-slate-300 mb-2">Preset Rules</h2>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="applyPreset('RL')" class="bg-slate-700 hover:bg-cyan-700 text-xs rounded px-2 py-1 transition">RL (Classic)</button>
          <button onclick="applyPreset('LLRR')" class="bg-slate-700 hover:bg-cyan-700 text-xs rounded px-2 py-1 transition">LLRR (Highway)</button>
          <button onclick="applyPreset('LRRRRRLLR')" class="bg-slate-700 hover:bg-cyan-700 text-xs rounded px-2 py-1 transition">LRRRRRLLR</button>
          <button onclick="applyPreset('RLLLLRRR')" class="bg-slate-700 hover:bg-cyan-700 text-xs rounded px-2 py-1 transition">RLLLLRRR</button>
        </div>
      </div>

      <!-- Rule Editor -->
      <div class="control-section pb-3">
        <h2 class="text-sm font-semibold text-slate-300 mb-2">Multi-Color Rules (2-8 colors)</h2>
        <div class="flex gap-2 mb-2">
          <input id="ruleInput" type="text" value="RL" maxlength="8"
            class="flex-1 bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm font-mono uppercase"
            placeholder="e.g. LLRR" aria-label="Rule string (L R U N per color)">
          <button onclick="applyCustomRule()" class="bg-cyan-700 hover:bg-cyan-600 text-xs rounded px-2 py-1 transition">Apply</button>
        </div>
        <p class="text-xs text-slate-400">L=Left R=Right U=U-turn N=No turn</p>
        <div id="colorPickers" class="mt-2 space-y-1"></div>
      </div>

      <!-- Ants -->
      <div class="control-section pb-3">
        <h2 class="text-sm font-semibold text-slate-300 mb-2">Ants (max 5)</h2>
        <div id="antList" class="space-y-1 mb-2"></div>
        <button onclick="addAnt()" class="bg-slate-700 hover:bg-green-700 text-xs rounded px-2 py-1 transition w-full">+ Add Ant</button>
      </div>

      <!-- Playback -->
      <div class="control-section pb-3">
        <h2 class="text-sm font-semibold text-slate-300 mb-2">Playback</h2>
        <div class="flex gap-2 mb-3">
          <button id="playBtn" onclick="togglePlay()" class="flex-1 bg-green-700 hover:bg-green-600 text-sm rounded px-3 py-1.5 transition">Play</button>
          <button onclick="step()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-sm rounded px-3 py-1.5 transition">Step</button>
          <button onclick="resetSim()" class="flex-1 bg-red-900 hover:bg-red-700 text-sm rounded px-3 py-1.5 transition">Reset</button>
        </div>
        <label class="text-xs text-slate-400 block mb-1">Speed: <span id="speedLabel">10</span> steps/frame</label>
        <input id="speedSlider" type="range" min="1" max="100" value="10"
          class="w-full accent-cyan-500" aria-label="Speed slider" oninput="updateSpeed()">
      </div>
    </div>
  </div>
</div>

<script>
const GRID = 200;
const CELL = 500 / GRID; // 2.5px per cell
const canvas = document.getElementById('antCanvas');
const ctx = canvas.getContext('2d');

let rule = 'RL';
let numColors = 2;
let colors = ['#ffffff', '#000000', '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff', '#ff9f1c'];
let grid = new Uint8Array(GRID * GRID);
let ants = [];
let generation = 0;
let running = false;
let animId = null;
let stepsPerFrame = 10;

const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // N E S W

function initGrid() {
  grid = new Uint8Array(GRID * GRID);
}

function defaultAnts() {
  ants = [{ x: 100, y: 100, dir: 0 }];
}

function applyPreset(r) {
  rule = r;
  document.getElementById('ruleInput').value = r;
  applyRule(r);
}

function applyCustomRule() {
  const v = document.getElementById('ruleInput').value.toUpperCase().replace(/[^LRUN]/g,'');
  if (v.length < 2 || v.length > 8) { alert('Rule must be 2-8 characters (L/R/U/N)'); return; }
  rule = v;
  document.getElementById('ruleInput').value = v;
  applyRule(v);
}

function applyRule(r) {
  rule = r;
  numColors = r.length;
  resetSim();
  renderColorPickers();
}

function renderColorPickers() {
  const cont = document.getElementById('colorPickers');
  cont.innerHTML = '';
  for (let i = 0; i < numColors; i++) {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 text-xs';
    const label = document.createElement('span');
    label.textContent = `State ${i} (${rule[i]})`;
    label.className = 'w-20 text-slate-300';
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = colors[i] || '#888888';
    inp.className = 'w-8 h-6 rounded cursor-pointer bg-transparent border-0';
    inp.setAttribute('aria-label', `Color for state ${i}`);
    const idx = i;
    inp.addEventListener('input', () => { colors[idx] = inp.value; render(); });
    row.appendChild(label);
    row.appendChild(inp);
    cont.appendChild(row);
  }
}

function renderAntList() {
  const cont = document.getElementById('antList');
  cont.innerHTML = '';
  ants.forEach((ant, i) => {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-1 text-xs bg-slate-700 rounded px-2 py-1';
    const info = document.createElement('span');
    info.className = 'flex-1 font-mono text-slate-300';
    info.textContent = `Ant${i+1} (${ant.x},${ant.y}) dir:${['N','E','S','W'][ant.dir]}`;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.className = 'text-red-400 hover:text-red-300 ml-1';
    btn.setAttribute('aria-label', `Remove ant ${i+1}`);
    btn.addEventListener('click', () => { ants.splice(i, 1); renderAntList(); });
    row.appendChild(info);
    row.appendChild(btn);
    cont.appendChild(row);
  });
}

function addAnt() {
  if (ants.length >= 5) { alert('Maximum 5 ants'); return; }
  const x = Math.floor(Math.random() * GRID);
  const y = Math.floor(Math.random() * GRID);
  const dir = Math.floor(Math.random() * 4);
  ants.push({ x, y, dir });
  renderAntList();
}

function stepAnts() {
  ants.forEach(ant => {
    const idx = ant.y * GRID + ant.x;
    const state = grid[idx];
    const turn = rule[state];
    // turn
    if (turn === 'R') ant.dir = (ant.dir + 1) % 4;
    else if (turn === 'L') ant.dir = (ant.dir + 3) % 4;
    else if (turn === 'U') ant.dir = (ant.dir + 2) % 4;
    // N = no turn
    // increment color
    grid[idx] = (state + 1) % numColors;
    // move
    ant.x = (ant.x + DIRS[ant.dir][0] + GRID) % GRID;
    ant.y = (ant.y + DIRS[ant.dir][1] + GRID) % GRID;
  });
  generation++;
}

function render() {
  const imageData = ctx.createImageData(500, 500);
  const data = imageData.data;
  // Parse colors once
  const parsed = colors.slice(0, numColors).map(c => {
    const r = parseInt(c.slice(1,3),16);
    const g = parseInt(c.slice(3,5),16);
    const b = parseInt(c.slice(5,7),16);
    return [r,g,b];
  });
  for (let gy = 0; gy < GRID; gy++) {
    for (let gx = 0; gx < GRID; gx++) {
      const state = grid[gy * GRID + gx];
      const [r,g,b] = parsed[state] || [128,128,128];
      // Fill CELL×CELL pixels
      for (let py = 0; py < CELL; py++) {
        for (let px = 0; px < CELL; px++) {
          const pi = ((gy * CELL + py) * 500 + (gx * CELL + px)) * 4;
          data[pi] = r; data[pi+1] = g; data[pi+2] = b; data[pi+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
  // Draw ants
  ants.forEach((ant, i) => {
    ctx.fillStyle = ['#ff0000','#00ff00','#0000ff','#ff00ff','#ffff00'][i % 5];
    ctx.fillRect(ant.x * CELL, ant.y * CELL, CELL * 2, CELL * 2);
  });
  document.getElementById('genCounter').textContent = generation.toLocaleString();
}

function step() {
  for (let i = 0; i < stepsPerFrame; i++) stepAnts();
  render();
}

function togglePlay() {
  running = !running;
  document.getElementById('playBtn').textContent = running ? 'Pause' : 'Play';
  document.getElementById('playBtn').className = running
    ? 'flex-1 bg-yellow-700 hover:bg-yellow-600 text-sm rounded px-3 py-1.5 transition'
    : 'flex-1 bg-green-700 hover:bg-green-600 text-sm rounded px-3 py-1.5 transition';
  if (running) loop();
}

function loop() {
  if (!running) return;
  step();
  animId = requestAnimationFrame(loop);
}

function resetSim() {
  running = false;
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('playBtn').textContent = 'Play';
  document.getElementById('playBtn').className = 'flex-1 bg-green-700 hover:bg-green-600 text-sm rounded px-3 py-1.5 transition';
  initGrid();
  generation = 0;
  defaultAnts();
  renderAntList();
  render();
}

function updateSpeed() {
  stepsPerFrame = parseInt(document.getElementById('speedSlider').value);
  document.getElementById('speedLabel').textContent = stepsPerFrame;
}

// Init
applyRule('RL');
document.getElementById('ruleInput').value = 'RL';
renderColorPickers();
defaultAnts();
renderAntList();
render();
</script>
</body>
</html>
